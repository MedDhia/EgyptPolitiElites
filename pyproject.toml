[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "politi"
version = "0.1.0"
description = "Elite network dataset from Politi's Annuaire des sociétés égyptiennes par actions"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "networkx>=3.0",
    "pdfplumber>=0.10",
    "Unidecode>=1.3",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
politi = "politi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
